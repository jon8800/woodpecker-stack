services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: woodpecker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: woodpecker
    volumes:
      - wp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U woodpecker -d woodpecker"]
      interval: 10s
      timeout: 5s
      retries: 5

  woodpecker:
    image: woodpeckerci/woodpecker-server:v3
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_WOODPECKER_8000
      - WOODPECKER_HOST=${SERVICE_URL_WOODPECKER}
      - WOODPECKER_OPEN=false
      - WOODPECKER_ADMIN=jon8800
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET}
      - WOODPECKER_DATABASE_DRIVER=postgres
      - WOODPECKER_DATABASE_DATASOURCE=postgres://woodpecker:${POSTGRES_PASSWORD}@postgres:5432/woodpecker?sslmode=disable
      - WOODPECKER_LOG_LEVEL=info
    labels:
      # Force Traefik to route HTTP traffic to port 8000 (web UI) rather than
      # the also-exposed port 9000 (gRPC for agent). Single service definition,
      # both Coolify-generated routers point at it (avoid duplicate-service error).
      - "traefik.http.services.woodpecker-web.loadbalancer.server.port=8000"
      - "traefik.http.routers.http-0-mih7wic8oouvanq0m0xmtiyl-woodpecker.service=woodpecker-web"
      - "traefik.http.routers.https-0-mih7wic8oouvanq0m0xmtiyl-woodpecker.service=woodpecker-web"
    expose:
      - "8000"
    ports:
      - "9000:9000"
    volumes:
      - wp_data:/var/lib/woodpecker
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wp_pg:
  wp_data:
